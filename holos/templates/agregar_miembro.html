{% extends "base.html" %}

{% block title %}Agregar holomiembro{% endblock %}

{% block content %}
<main class="form-page" id="contenido-principal">
	<div class="container">
		<div class="form-card">
			<header class="form-heading mb-4">
				<p class="eyebrow mb-2">Una nueva voz en escena</p>
				<h1 class="h2 section-title mb-2">Agregar holomiembro</h1>
				<p class="text-muted-custom mb-0">Cada talento suma una nueva historia a la comunidad.</p>
			</header>

			<form method="post" novalidate>
				{% csrf_token %}
				{{ form.as_p }}

				<div class="form-actions d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 mt-4 pt-3">
					<a class="btn btn-cancel" href="{% url 'home' %}">Cancelar</a>
					<button class="btn btn-save" type="submit"><span aria-hidden="true">✦</span> Guardar</button>
				</div>
			</form>
		</div>
	</div>
</main>
{% endblock %}
