{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<main class="form-page" id="contenido-principal">
	<div class="container">
		<section class="form-card auth-card" aria-labelledby="login-title">
			<header class="form-heading mb-4">
				<p class="eyebrow mb-2">Qué bueno tenerte por aquí</p>
				<h1 class="h2 section-title mb-2" id="login-title">Iniciar sesión</h1>
				<p class="text-muted-custom mb-0">Entra para cuidar y actualizar los perfiles de la comunidad.</p>
			</header>

			<form method="post" action="{% url 'login' %}" novalidate>
				{% csrf_token %}
				<input type="hidden" name="next" value="{{ next }}">
				{{ form.as_p }}

				<div class="form-actions d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 mt-4 pt-3">
					<a class="btn btn-cancel" href="{% url 'home' %}">Volver a la lista</a>
					<button class="btn btn-save" type="submit"><span aria-hidden="true">✦</span> Iniciar sesión</button>
				</div>
			</form>
		</section>
	</div>
</main>
{% endblock %}
